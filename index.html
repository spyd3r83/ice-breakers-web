<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <title>Ice Breakers Classic Remake</title>
  <link rel="icon" href="data:,">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #020812;
      overflow: hidden;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Courier New", monospace;
    }
    #game {
      display: block;
      background: #04101f;
      image-rendering: auto;
      box-shadow: 0 0 60px rgba(90, 190, 255, 0.18);
    }
    html, body, #game { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    html { -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
    #touch, #touch * { touch-action: none; }
    #dpad span { pointer-events: none; }
    /* Phones held upright: rotate the whole page so the game fills the screen sideways. */
    @media (orientation: portrait) and (pointer: coarse) {
      body {
        position: fixed; top: 0; left: 0; width: 100vh; height: 100vw; width: 100dvh; height: 100dvw;
        transform-origin: top left; transform: rotate(90deg) translateY(-100%);
      }
    }
    #touch { display: none; }
    .touch #touch { display: block; }
    #touch > * {
      position: fixed; box-sizing: border-box; touch-action: none;
      color: #eaf8ff; font: bold 18px "Courier New", monospace;
      background: rgba(120, 190, 255, 0.22); border: 2px solid rgba(190, 230, 255, 0.6);
      border-radius: 18px; padding: 0; -webkit-tap-highlight-color: transparent;
    }
    #touch > button:active { background: rgba(120, 190, 255, 0.45); }
    #dpad span { padding: 4px 8px; border-radius: 12px; }
    #dpad span.on { background: #ffe680; color: #04101f; }
    .ico { display: block; font-size: 22px; line-height: 1; }
    #dpad {
      left: calc(10px + env(safe-area-inset-left)); bottom: calc(14px + env(safe-area-inset-bottom));
      width: 112px; height: 132px; display: flex; flex-direction: row; align-items: center; justify-content: space-around; font-size: 30px;
    }
    #kick, #jump { right: calc(10px + env(safe-area-inset-right)); width: 112px; height: 76px; font-size: 20px; }
    #jump { bottom: calc(14px + env(safe-area-inset-bottom)); }
    #kick { bottom: calc(102px + env(safe-area-inset-bottom)); }
    /* Right column above KICK so it never covers the climber or the HUD. */
    #slide { display: none; right: calc(10px + env(safe-area-inset-right)); bottom: calc(190px + env(safe-area-inset-bottom)); width: 112px; height: 44px; font-size: 16px; border-radius: 12px; }
    #pause { top: calc(64px + env(safe-area-inset-top)); left: calc(10px + env(safe-area-inset-left)); width: 84px; height: 36px; font-size: 16px; border-radius: 12px; }
    #newrun, #continue { display: none; top: 82%; height: 48px; border-radius: 12px; font-size: 13px; }
    #newrun { left: calc(50% - 166px); width: 140px; }
    #continue { left: calc(50% - 14px); width: 180px; white-space: normal; line-height: 1.1; font-size: 12px; }
  </style>
</head>
<body>
  <canvas id="game" width="1920" height="1080" aria-label="Ice Breakers game canvas"></canvas>
  <div id="touch">
    <div id="dpad" role="group" aria-label="Move left or right"><span aria-hidden="true">&#9664;</span><span aria-hidden="true">&#9654;</span></div>
    <button id="kick" data-code="KeyZ"><span class="ico" aria-hidden="true">&#10022;</span>KICK</button>
    <button id="jump" data-code="Space"><span class="ico" aria-hidden="true">&#9650;</span>JUMP</button>
    <button id="slide" data-code="ArrowDown" aria-label="Slide">SLIDE</button>
    <button id="pause" data-code="Escape" aria-label="Pause">II</button>
    <button id="newrun" aria-label="New run">NEW RUN</button>
    <button id="continue" aria-label="Continue run">CONTINUE</button>
  </div>
  <noscript>Ice Breakers needs JavaScript enabled.</noscript>
  <script src="game.js"></script>
</body>
</html>
